<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>
<body>
    <h1>Ejemplo de tabla</h1>
    <table border="1" id="tabla" alt="Tabla de ejemplo">
        <tr>
           <th colspan="3">Monos</th> 
        </tr>
        <tr>
            <th > Nombre </th>
            <th> Edad </th>
            <th> Ciudad </th>
        </tr>
        <tr>
            <td>Juan</td>
            <td rowspan="2">20</td>
            <td rowspan="2">Quito</td>
        </tr>
        <tr>
            <td>Jostyn</td>
            
        </tr>
    </table>
    <br>
    <table id="Zz" alt="Tabla de ejemplo" border="1">
        <caption>Tabla de ejemplo</caption>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Ciudad</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Juan</td>
                <td>20</td>
                <td>Quito</td>
            </tr>
            <tr>
                <td>Jostyn</td>
                <td>20</td>
                <td>Quito</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Fin de la tabla</td>
            </tr>
        </tfoot>    
    </table>
</body>
</html>
