<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Vlzz | Multimedia</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav id="menu" title="Menú de navegación">
        <a href="index.html">Inicio</a>
        <a href="personajes.html">Barberos</a>
        <a href="misiones.html">Servicios</a>
        <a href="multimedia.html">Multimedia</a>
        <a href="inscripcion.html">Reservas</a>
    </nav>
    <header id="cabecera" title="Multimedia">
        <h1>Multimedia</h1>
        <p>Mira nuestro trabajo</p>
    </header>
    <main id="contenido">
        <section id="video" title="Video">
            <h2>Video de nuestros cortes</h2>
            <video controls width="640" height="360">
                <source src="videos/corte.mp4" type="video/mp4">
            </video>
        </section>
        <section id="audio" title="Audio">
            <h2>Música de la barbería</h2>
            <audio controls>
                <source src="audios/musica.mp3" type="audio/mpeg">
            </audio>
        </section>
        <section id="galeria" title="Galería">
            <h2>Galería</h2>
            <img
            src="imagenes/corte1.jpg"
            alt="Corte con diseño de número"
            width="200"
            height="210"
            >
            <img
            src="imagenes/corte2.jpg"
            alt="Corte mullet con degradado"
            width="140"
            height="210"
            >
            <img
            src="imagenes/corte3.jpg"
            alt="Corte con diseño de letras"
            width="280"
            height="210"
            >
        </section>
        <section id="ubicacion" title="Ubicación">
            <h2>Ubicación</h2>
            <iframe src="https://www.google.com/maps?q=Quito&output=embed"
            width="600" height="350" title="Ubicación de la barbería" loading="lazy"></iframe>
        </section>
    </main>
    <footer id="pie" title="Pie de página">
        <p><small>2026 Barbería Vlzz. Todos los derechos reservados.</small></p>
    </footer>
</body>
</html>
