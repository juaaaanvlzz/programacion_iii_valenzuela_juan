<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Vlzz | Tablas</title>
</head>
<body>
    <h1>Precios de Barbería Vlzz</h1>
    <table border="1" id="tabla" alt="Tabla de precios">
        <tr>
           <th colspan="3">Cortes</th>
        </tr>
        <tr>
            <th>Servicio</th>
            <th>Precio</th>
            <th>Duración</th>
        </tr>
        <tr>
            <td>Fade</td>
            <td rowspan="2">$8</td>
            <td rowspan="2">30 min</td>
        </tr>
        <tr>
            <td>Corte clásico</td>
        </tr>
    </table>
    <br>
    <table id="barberos" alt="Tabla de barberos" border="1">
        <caption>Nuestros barberos</caption>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Horario</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Juan</td>
                <td>Degradados</td>
                <td>Mañana</td>
            </tr>
            <tr>
                <td>Jostyn</td>
                <td>Barba y afeitado</td>
                <td>Tarde</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Reserva tu turno con tu barbero favorito</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
