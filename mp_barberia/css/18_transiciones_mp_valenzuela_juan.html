<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Vlzz | Transiciones</title>
    <link rel="stylesheet" href="18_transiciones_mp_valenzuela_juan.css">
</head>
<body>

    <main>

        <h1>Barbería Vlzz</h1>
        <p>Coloca el cursor sobre el botón</p>
        <button class="boton-cita">Reservar cita</button>

        <div class="tarjeta">
            <h2>Juan</h2>
            <p>Barbero principal</p>
        </div>

        <h1>Estación de corte</h1>
        <div class="estacion">
            <div class="tijera">Tijera</div>
        </div>

        <h1>Reloj de turnos</h1>
        <div class="reloj">
            <div class="aguja">⇒</div>
        </div>

        <h1>Estación de afeitado</h1>
        <div class="estacion">
            <div class="navaja">Navaja</div>
        </div>

        <h1>Poste de barbería</h1>
        <div class="pasillo">
            <div class="poste">Poste</div>
        </div>

        <div class="aviso">Últimos turnos del día</div>

    </main>

</body>
</html>
