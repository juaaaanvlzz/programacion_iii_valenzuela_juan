<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Vlzz | Animaciones</title>
    <link rel="stylesheet" href="19_transiciones_integracion_mp_valenzuela_juan.css">
</head>
<body>

    <header>
        <h1>Barbería Vlzz en Acción</h1>
        <p>Simulación de una jornada de cortes en la barbería.</p>
    </header>

    <main>

        <section class="escena" aria-label="Escena animada de la barbería">

            <div class="foco foco1"></div>
            <div class="foco foco2"></div>
            <div class="foco foco3"></div>
            <div class="foco foco4"></div>
            <div class="foco foco5"></div>

            <div class="tijera">
                <span aria-hidden="true">✂</span>
                <p>Tijera</p>
            </div>

            <div class="aviso">ÚLTIMOS TURNOS</div>

        </section>

        <section class="controles">

            <h2>Recepción</h2>

            <div class="panel">

                <article class="turnos-contenedor">
                    <h3>Llamado de turnos</h3>
                    <div class="turnos" aria-hidden="true">
                        <div class="pulso"></div>
                        <div class="centro"></div>
                    </div>
                </article>

                <article class="estado">
                    <h3>Estado de la jornada</h3>
                    <p>Atención al público activa.</p>
                    <p>Servicio: Corte y barba</p>
                    <p>Sede: Barbería Vlzz</p>
                </article>

            </div>

        </section>

    </main>

    <footer>
        <p>Barbería Vlzz - 2026</p>
    </footer>

</body>
</html>
